name: substrate
version: 0.10.0
python_runtime: external
description: Substrate retrieval, durable completed-turn capture, session boundaries, memory write tools, and past-conversation import for Hermes
provides_tools:
  - memory_search
  - memory_expand
  - memory_evidence
  - memory_remember
  - memory_forget
  - substrate_import
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
optional_env:
  - SUBSTRATE_API_URL
  - SUBSTRATE_API_KEY
  - SUBSTRATE_AGENT_NAME
  - SUBSTRATE_TOOL_TIMEOUT_SECONDS
