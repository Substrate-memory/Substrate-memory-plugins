# Hermes entry for installing this whole repository by its URL:
#   hermes plugins install https://github.com/Substrate-memory/Substrate-memory-plugins
# Loads plugins/substrate-hermes (see __init__.py). Keep in sync with
# plugins/substrate-hermes/plugin.yaml (tests/test_packaging.py checks it).
name: substrate
version: 0.8.0
description: Substrate retrieval, durable completed-turn capture, session boundaries, and memory write tools for Hermes
provides_tools:
  - memory_search
  - memory_expand
  - memory_evidence
  - memory_remember
  - memory_forget
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
optional_env:
  - SUBSTRATE_API_URL
  - SUBSTRATE_API_KEY
  - SUBSTRATE_AGENT_NAME
