# Hermes entry for installing this whole repository by its URL:
#   hermes plugins install https://github.com/Substrate-memory/Substrate-memory-plugins
# Loads plugins/substrate-hermes (see __init__.py). Keep in sync with
# plugins/substrate-hermes/plugin.yaml (tests/test_packaging.py checks it).
name: substrate
version: 0.10.3
# stdlib-only: Hermes must not install or lock anything for this plugin
# (its pyproject.toml is repository tooling, not a runtime declaration).
python_runtime: external
description: Substrate retrieval, durable completed-turn capture, session boundaries, memory write tools, and past-conversation import for Hermes
provides_tools:
  - memory_search
  - memory_expand
  - memory_evidence
  - memory_remember
  - memory_forget
  - substrate_import
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
optional_env:
  - SUBSTRATE_API_URL
  - SUBSTRATE_API_KEY
  - SUBSTRATE_AGENT_NAME
  - SUBSTRATE_TOOL_TIMEOUT_SECONDS
