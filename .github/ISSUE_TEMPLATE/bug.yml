name: Bug report
description: Report reproducible plugin behavior without sensitive data
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private history, customer content, server URLs, or exploit details. Use the private security-advisory flow for vulnerabilities.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      placeholder: 0.20.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Use synthetic or content-free diagnostics only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands with all secrets and private endpoints replaced.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
