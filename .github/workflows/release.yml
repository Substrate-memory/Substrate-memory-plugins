name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact independently reviewed main commit to release
        required: true
        type: string
      publish_approval:
        description: Explicit owner approval; leave REVIEW for verification only
        required: true
        default: REVIEW
        type: choice
        options: [REVIEW, PUBLISH]

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      artifact_digest: ${{ steps.release_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind to protected main candidate and require DCO
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          git show --no-patch --format='%B' "$CANDIDATE_SHA" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'
      - name: Scan pristine candidate
        run: python3 scripts/check_public_hygiene.py --root .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --no-install-project
      - name: Verify and build exact candidate
        id: metadata
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          test -n "$version"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          hermes_version="$(python -c 'from pathlib import Path; print(next(line.split(":", 1)[1].strip() for line in Path("plugins/substrate-hermes/plugin.yaml").read_text().splitlines() if line.startswith("version: ")))')"
          test "$hermes_version" = 0.8.0
          .venv/bin/ruff check .
          .venv/bin/python -m compileall -q plugins scripts
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/build_release.py
          cp dist/*.zip "$RUNNER_TEMP/"
          rm -rf dist; .venv/bin/python scripts/build_release.py
          for archive in substrate-hermes.zip substrate-claude.zip substrate-codex.zip substrate-mcp.zip; do
            cmp "$RUNNER_TEMP/$archive" "dist/$archive"
          done
          .venv/bin/python scripts/build_release.py --check
          printf 'release_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Upload exact verified bytes
        id: release_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.candidate_sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha && inputs.publish_approval == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ inputs.candidate_sha }}
          path: dist
      - name: Verify downloaded release set
        run: |
          set -euo pipefail
          test -n "${{ needs.verify.outputs.artifact_digest }}"
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'SHA256SUMS substrate-claude.zip substrate-codex.zip substrate-hermes.zip substrate-mcp.zip '
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4 # pinned
        with:
          subject-path: dist/*
      - name: Promote only a matching owner-created draft
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          tag="v$RELEASE_VERSION"
          release_json="$RUNNER_TEMP/release.json"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,targetCommitish,assets > "$release_json"
          python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["isDraft"] is True; assert sorted(a["name"] for a in r["assets"]) == ["SHA256SUMS", "substrate-claude.zip", "substrate-codex.zip", "substrate-hermes.zip", "substrate-mcp.zip"]' "$release_json"
          rm -rf "$RUNNER_TEMP/existing-release"; mkdir -p "$RUNNER_TEMP/existing-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/existing-release"
          for archive in substrate-hermes.zip substrate-claude.zip substrate-codex.zip substrate-mcp.zip SHA256SUMS; do
            cmp "dist/$archive" "$RUNNER_TEMP/existing-release/$archive"
          done
          # A review draft has no public tag. Create one only after the owner
          # selects PUBLISH and all candidate/draft/byte checks have passed.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$CANDIDATE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$CANDIDATE_SHA" >/dev/null
          fi
          # Preserve the detailed reviewed notes; only promote the verified draft.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --draft=false
