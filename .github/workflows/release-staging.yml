name: Release staging

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Candidate commit to build for review
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          [[ "${{ inputs.candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          python3 scripts/check_public_hygiene.py --root .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev --no-install-project
      - run: |
          uv run --no-sync ruff check .
          uv run --no-sync python -m pytest -q
          uv run --no-sync python scripts/build_release.py
          cp dist/*.zip "$RUNNER_TEMP/"
          rm -rf dist; uv run --no-sync python scripts/build_release.py
          cmp "$RUNNER_TEMP/substrate.zip" dist/substrate.zip
          cmp "$RUNNER_TEMP/substrate-mcp.zip" dist/substrate-mcp.zip
          uv run --no-sync python scripts/build_release.py --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draft-${{ inputs.candidate_sha }}
          path: dist/*
          compression-level: 0
          retention-days: 7
